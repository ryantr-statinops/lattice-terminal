[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-terminal-api"
version = "0.1.0"
description = "Read-only synthetic Kestrel Terminal API scaffold"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
