[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestrel-terminal-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "pydantic>=2,<3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "ta-lib>=0.8.2",
    "duckdb>=1.5.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["kestrel_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
