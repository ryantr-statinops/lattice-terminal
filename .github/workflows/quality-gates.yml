name: Kestrel Quality Gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build
      - run: npm run check
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
          python-version: '3.12'
      - run: uv sync --project services/engine --frozen
      - run: uv run --project services/engine pytest
      - run: uv run --project services/engine python scripts/export-engine-contracts.py --check
      - run: uv tool run --from pip-audit==2.10.1 pip-audit --path services/engine/.venv/Lib/site-packages --skip-editable --progress-spinner off
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false
      - run: go -C services/gateway test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: node scripts/contracts.mjs
  windows-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
          python-version: '3.12'
      - run: ./scripts/setup.ps1
      - run: uv run --project services/engine python scripts/smoke-windows.py
