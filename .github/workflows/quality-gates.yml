name: Quality Gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: Public Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run security:env-boundaries
      - run: npm run fixtures:check
      - run: npm run test:tooling
      - run: npm run test:web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  api:
    name: FastAPI and OpenAPI
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m pytest
      - run: uv run --frozen python scripts/export_openapi.py
      - run: git diff --exit-code -- packages/contracts/openapi.json
        working-directory: .
      - run: python -m unittest discover -s tests
        working-directory: services/research
  go:
    name: Gateway and fixture ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false
      - run: go -C services/gateway test ./...
      - run: go -C services/ingestion test ./...
      - run: go -C services/ingestion run ./cmd/ingest
