services:
  kestrel:
    build:
      target: dev
    entrypoint:
      - /bin/sh
      - -c
    command:
      - go build -o /tmp/kestrel ./cmd/kestrel && exec /tmp/kestrel -root /app -data /data -dev
    working_dir: /app/services/gateway
    read_only: false
    environment:
      KESTREL_VITE_HOST: 0.0.0.0
      GOPATH: /go
      GOCACHE: /tmp/go-build
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - kestrel_node_modules:/app/node_modules
      - kestrel_engine_venv:/app/services/engine/.venv
      - kestrel_go_modules:/go/pkg/mod
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    stop_grace_period: 30s

volumes:
  kestrel_node_modules:
  kestrel_engine_venv:
  kestrel_go_modules:
