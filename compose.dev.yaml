services:
  kestrel:
    image: kestrel-terminal:dev
    build:
      target: dev
    entrypoint:
      - /bin/sh
      - -c
    command:
      - go build -o /tmp/kestrel ./cmd/kestrel && exec /tmp/kestrel -root /app -data /data -dev
    working_dir: /app/services/gateway
    read_only: false
    environment:
      GOPATH: /go
      GOCACHE: /go/build-cache
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - kestrel_node_modules:/app/node_modules
      - kestrel_engine_venv:/app/services/engine/.venv
      - kestrel_go_modules:/go/pkg/mod
    stop_grace_period: 30s
  web:
    image: kestrel-terminal:web-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: npm run dev --workspace=@kestrel-terminal/web -- --host 0.0.0.0 --strictPort
    working_dir: /app
    environment:
      KESTREL_API_PROXY: http://kestrel:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - kestrel_node_modules:/app/node_modules
    depends_on:
      kestrel:
        condition: service_healthy
    stop_grace_period: 10s

volumes:
  kestrel_node_modules:
  kestrel_engine_venv:
  kestrel_go_modules:
